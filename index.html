<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEEPTRACE AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&family=Chivo:wght@600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#22d3ee','on-primary':'#0b0a1d',secondary:'#ec4899',surface:'#120f26','surface-container':'#1e1b3a','surface-container-high':'#2a2650','surface-container-lowest':'#0d0b20','on-surface':'#eeeafc','on-surface-variant':'#b9b3dd',outline:'#8c86b8','outline-variant':'#38325f'}}}}</script>
<style>
html,body{height:100%;margin:0;overscroll-behavior:none}html{color-scheme:dark}body{font-family:Geist,system-ui,sans-serif;background:radial-gradient(800px 500px at 92% -8%,rgba(236,72,153,.22),transparent 60%),radial-gradient(800px 520px at -8% 108%,rgba(34,211,238,.16),transparent 60%),#120f26;background-attachment:fixed}.material-symbols-outlined{font-family:'Material Symbols Outlined';font-size:20px;line-height:1}.logo{background:linear-gradient(135deg,#ec4899,#22d3ee);box-shadow:0 0 24px #ec489955}.card{background:rgba(30,27,58,.72);backdrop-filter:blur(10px);transition:.2s}.card:hover{transform:translateY(-3px);border-color:#22d3ee99;box-shadow:0 12px 30px -12px #ec489977}.bub{white-space:pre-wrap;word-break:break-word}.bub pre{background:#0d0b20;border:1px solid #38325f;border-radius:6px;padding:8px;overflow:auto;font:12px 'JetBrains Mono',monospace}.dots span{animation:pulse 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes pulse{50%{opacity:.2}}#sidebar.closed{display:none!important}@media(max-width:767px){#sidebar.open{display:flex!important;position:fixed;inset:0 auto 0 0;z-index:50;box-shadow:0 0 40px #0009}}
</style>
</head>
<body class="text-on-surface antialiased">
<div class="flex h-screen w-full overflow-hidden">
<aside id="sidebar" class="w-72 shrink-0 bg-surface-container-lowest/80 border-r border-outline-variant/30 hidden md:flex flex-col justify-between backdrop-blur-xl">
 <div class="flex flex-col gap-3 p-3 overflow-y-auto"><div class="flex items-center justify-between px-1 py-1"><div class="flex items-center gap-2"><span class="logo w-8 h-8 rounded-xl"></span><span class="text-sm font-bold tracking-wide" style="font-family:Chivo">DEEPTRACE AI</span></div><button id="closeSide" class="p-1 text-on-surface-variant hover:text-white" aria-label="Close menu"><span class="material-symbols-outlined">left_panel_close</span></button></div>
 <button id="newChat" class="flex items-center gap-2 w-full px-3 py-2.5 rounded-xl bg-surface-container hover:bg-surface-container-high border border-outline-variant/40 text-xs font-semibold"><span class="material-symbols-outlined text-primary">add</span>New Investigation</button><div class="text-[11px] font-semibold text-outline px-2 uppercase tracking-wider mt-2">Recent Analyses</div><div id="recent" class="flex flex-col gap-1"></div></div>
 <div class="p-3 border-t border-outline-variant/30 flex items-center gap-2"><span class="logo w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold">DT</span><span class="text-xs font-medium">DEEPTRACE AI</span></div>
</aside>
<main class="flex-1 flex flex-col h-full min-w-0 overflow-hidden">
<header class="h-14 border-b border-outline-variant/30 px-3 flex items-center justify-between shrink-0 bg-[#120f26bb] backdrop-blur-xl z-20"><div class="flex items-center gap-2.5"><button id="menuBtn" class="w-8 h-8 rounded-xl bg-surface-container border border-outline-variant/30 flex items-center justify-center" aria-label="Open menu"><span class="material-symbols-outlined">left_panel_open</span></button><span class="logo w-8 h-8 rounded-xl"></span><span class="text-sm font-bold tracking-wide" style="font-family:Chivo">DEEPTRACE AI</span></div><button id="headerNew" class="px-3 py-2 rounded-xl text-xs font-semibold text-white" style="background:linear-gradient(135deg,#ec4899,#7c3aed)">＋ <span class="hidden sm:inline">NEW CHAT</span></button></header>
<section id="scroller" class="flex-1 overflow-y-auto px-4 py-6 flex flex-col items-center justify-center"><div id="messages" class="hidden max-w-3xl w-full mx-auto flex flex-col gap-3 pb-2"></div><div id="welcome" class="max-w-3xl w-full mx-auto flex flex-col items-center text-center px-4 py-8"><div class="logo w-24 h-24 rounded-[28px] mb-6 flex items-center justify-center text-4xl font-bold" style="font-family:Chivo">DT</div><h1 class="text-2xl md:text-3xl font-bold tracking-tight" style="font-family:Chivo">Welcome to <span style="background:linear-gradient(90deg,#22d3ee,#fff,#ec4899);background-clip:text;color:transparent">DEEPTRACE AI</span><div class="text-lg md:text-xl mt-2 font-normal text-on-surface-variant" style="font-family:Geist">Investigate evidence, verify media, or tackle any task.</div></h1><div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-8 w-full max-w-xl"><button class="card text-left p-4 rounded-2xl border border-outline-variant/50" data-prompt="I need to verify a press conference video. Give me a step-by-step forensic checklist for spotting manipulation or deepfakes."><b>🎞️ Verify Press Video</b><span class="block text-xs text-outline mt-1">Check footage for manipulation</span></button><button class="card text-left p-4 rounded-2xl border border-outline-variant/50" data-prompt="How can I test whether a recorded call is a cloned or synthetic voice? List technical indicators and tools."><b>◖ Test Cloned Audio</b><span class="block text-xs text-outline mt-1">Spot synthetic voices</span></button><button class="card text-left p-4 rounded-2xl border border-outline-variant/50" data-prompt="How do I audit a PDF for tampering? Cover metadata, revision history, fonts, and signatures."><b>▤ Audit PDF Document</b><span class="block text-xs text-outline mt-1">Detect tampering and edits</span></button><button class="card text-left p-4 rounded-2xl border border-outline-variant/50" data-prompt="Explain common visual and audio indicators of synthetic media and how reliable each one is."><b>✳ Explain Synthetic Indicators</b><span class="block text-xs text-outline mt-1">Learn the telltale signs</span></button></div></div></section>
<footer class="p-3 bg-[#120f26ee] border-t border-outline-variant/30 shrink-0 backdrop-blur-xl"><div class="max-w-4xl mx-auto flex flex-col gap-2"><div id="chips" class="flex gap-2 flex-wrap empty:hidden"></div><form id="chatForm" class="flex items-center gap-2 bg-surface-container border border-outline-variant/40 focus-within:border-primary/70 rounded-2xl shadow-sm p-1.5"><label class="w-9 h-9 rounded-xl hover:bg-surface-container-high text-on-surface-variant flex items-center justify-center cursor-pointer" title="Attach files"><span class="material-symbols-outlined">attach_file</span><input id="fileInput" class="hidden" type="file" multiple accept=".txt,.md,.csv,.json,.png,.jpg,.jpeg,.webp,.pdf,.wav,.mp3,.mp4,.mov"></label><input id="prompt" class="flex-1 min-w-0 bg-transparent border-0 px-2 py-2 text-sm text-on-surface placeholder:text-outline focus:outline-none" placeholder="Ask Deeptrace anything to begin..." autocomplete="off"><button id="send" class="w-9 h-9 rounded-xl text-white flex items-center justify-center" style="background:linear-gradient(135deg,#ec4899,#7c3aed)" title="Send"><span class="material-symbols-outlined">arrow_upward</span></button></form><div class="text-[11px] text-outline text-center">Media can be attached for context. The assistant does not perform certified forensic authentication.</div></div></footer>
</main></div>
<script>
(()=>{
const $=id=>document.getElementById(id),messages=$('messages'),scroller=$('scroller'),welcome=$('welcome'),input=$('prompt'),recent=$('recent'),sidebar=$('sidebar'),filesEl=$('fileInput'),chips=$('chips');let chats=[],current=null,files=[],busy=false,style='concise';
try{chats=JSON.parse(localStorage.getItem('dt_chats')||'[]');style=localStorage.getItem('dt_style')||'concise'}catch{}
const system='You are DEEPTRACE AI, a friendly capable general-purpose assistant specializing in digital-media forensics. Help users with video, audio, images, and PDFs by explaining verification methods, metadata, tamper checks, and chain of custody. You cannot run certified forensic detection here; never declare media authentic or fake based only on a filename or metadata. State limitations and recommend a certified examiner for legal use. Be helpful on any topic. Response style: '+({concise:'concise and direct',detailed:'detailed and technical, with steps',plain:'plain English, avoiding jargon'}[style]||'concise and direct');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function format(s){return esc(s).replace(/```(?:\w+\n)?([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')}
function bubble(role,text){const row=document.createElement('div');row.className='flex '+(role==='user'?'justify-end':'justify-start');const box=document.createElement('div');box.className='bub text-sm leading-relaxed rounded-xl px-3 py-2 max-w-[85%] '+(role==='user'?'bg-primary/20 border border-primary/30':'bg-surface-container border border-outline-variant/30');box.innerHTML=format(text);row.appendChild(box);messages.appendChild(row);scroller.scrollTop=scroller.scrollHeight;return box}
function activate(on){messages.classList.toggle('hidden',!on);welcome.classList.toggle('hidden',on);scroller.classList.toggle('justify-center',!on);scroller.classList.toggle('justify-start',on)}
function save(){try{localStorage.setItem('dt_chats',JSON.stringify(chats.slice(0,30)))}catch{}}
function drawRecent(){recent.replaceChildren();if(!chats.length){recent.innerHTML='<div class="text-xs text-outline px-3 py-2">No investigations yet</div>';return}chats.forEach(c=>{const row=document.createElement('button');row.className='text-left truncate px-3 py-2 rounded-xl text-xs text-on-surface-variant hover:bg-surface-container';row.textContent=c.title;row.onclick=()=>openChat(c.id);recent.appendChild(row)})}
function fresh(){current=null;messages.replaceChildren();files=[];renderFiles();activate(false);drawRecent();sidebar.classList.remove('open');input.focus()}
function openChat(id){const c=chats.find(x=>x.id===id);if(!c)return;current=id;messages.replaceChildren();c.msgs.forEach(m=>bubble(m.role,m.content));activate(true);drawRecent();sidebar.classList.remove('open')}
function renderFiles(){chips.replaceChildren();files.forEach((f,i)=>{const chip=document.createElement('span');chip.className='inline-flex items-center gap-2 px-2 py-1 rounded-full bg-surface-container border border-outline-variant/30 text-xs';chip.textContent=f.name;const rm=document.createElement('button');rm.type='button';rm.textContent='×';rm.setAttribute('aria-label','Remove '+f.name);rm.onclick=()=>{files.splice(i,1);renderFiles()};chip.appendChild(rm);chips.appendChild(chip)})}
async function send(text=input.value){text=text.trim();if((!text&&!files.length)||busy)return;let c=chats.find(x=>x.id===current);if(!c){c={id:String(Date.now()),title:(text||files[0].name).slice(0,40),msgs:[]};chats.unshift(c);current=c.id}let userText=text;for(const f of files){if(/\.(txt|md|csv|json)$/i.test(f.name)||f.type.startsWith('text/')){try{userText+='\n\n[Attached '+f.name+']\n'+(await f.text()).slice(0,12000)}catch{userText+='\n[Could not read '+f.name+']'}}else userText+='\n[Attached '+f.name+' ('+(f.type||'unknown type')+', '+Math.round(f.size/1024)+' KB). This chat endpoint currently receives attachment information only, not media contents.]'}files=[];renderFiles();input.value='';c.msgs.push({role:'user',content:userText});activate(true);bubble('user',text||'Attached file(s)');drawRecent();const out=bubble('assistant','');out.innerHTML='<span class="dots">● ● ●</span>';busy=true;$('send').disabled=true;try{const history=[{role:'system',content:system},...c.msgs.slice(-20)];const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await response.json();if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);out.innerHTML=format(data.message||'No response received.');c.msgs.push({role:'assistant',content:data.message||''})}catch(e){out.textContent='Error: '+e.message;c.msgs.pop()}finally{busy=false;$('send').disabled=false;save();drawRecent();scroller.scrollTop=scroller.scrollHeight;input.focus()}}
$('chatForm').addEventListener('submit',e=>{e.preventDefault();send()});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('newChat').onclick=$('headerNew').onclick=fresh;document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>send(b.dataset.prompt));$('menuBtn').onclick=()=>sidebar.classList.toggle('open');$('closeSide').onclick=()=>sidebar.classList.remove('open');filesEl.onchange=()=>{files.push(...filesEl.files);filesEl.value='';renderFiles()};addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();files.push(...e.dataTransfer.files);renderFiles()});drawRecent();
})();
</script>
</body>
</html>
